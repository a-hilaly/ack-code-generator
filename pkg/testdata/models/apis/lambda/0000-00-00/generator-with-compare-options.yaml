resources:
  Function:
    fields:
      CodeLocation:
        is_read_only: true
        from:
          operation: GetFunction
          path: Code.Location
      CodeRepositoryType:
        is_read_only: true
        from:
          operation: GetFunction
          path: Code.RepositoryType
      # Test unordered comparison for string slices
      Layers:
        compare:
          unordered: true
      # Test IAM policy comparison
      Role:
        compare:
          is_iam_policy: true
      # Test ignore_if_annotation
      MemorySize:
        compare:
          ignore_if_annotation:
            key: "lambda.amazonaws.com/managed-by"
            value: "external-controller"
    synced:
      when:
        - path: Status.State
          in:
            - AVAILABLE
            - ACTIVE
        - path: Status.LastUpdateStatus
          in:
            - AVAILABLE
            - ACTIVE
        - path: Status.CodeSize
          in:
            - 1
            - 2
  CodeSigningConfig:
    fields:
      Tags:
        compare:
          is_ignored: true
ignore:
  field_paths:
    - CreateFunctionInput.Architectures
    - CreateFunctionInput.LoggingConfig
    - CreateFunctionInput.EphemeralStorage
    - FunctionCode.SourceKMSKeyArn
    - CreateFunctionInput.SnapStart
    - CreateFunctionInput.VpcConfig.Ipv6AllowedForDualStack
